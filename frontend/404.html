<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Page non trouvée | Kasa</title>
    <link rel="stylesheet" href="./style.css">
    <style>
      body {
        --corail: #ff6060;
        font-family: Montserrat, "Century Gothic", Arial, sans-serif;
      }

      .entete .logo {
        font-size: clamp(56px, 6vw, 86px);
      }

      .page-404 {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(6rem, 9.65vw, 8.6875rem);
        padding-block: clamp(6rem, 9.65vw, 8.6875rem);
        padding-top: clamp(2rem, 4.25vw, 3.825rem);
        text-align: center;
      }

      .page-404 h1 {
        margin: 0;
        color: var(--corail);
        font-size: clamp(6rem, 20vw, 18rem);
        font-weight: 700;
        line-height: 1;
      }

      .page-404 p {
        margin: 0;
        color: var(--corail);
        font-size: clamp(1.125rem, 2.5vw, 2.25rem);
        font-weight: 500;
        line-height: 1.35;
      }

      .page-404 a {
        color: inherit;
        font-size: clamp(.875rem, 1.25vw, 1.125rem);
      }

      .pied-de-page {
        min-height: 209px;
        align-content: center;
        gap: 28px;
        padding: 24px 20px;
      }

      @media (max-width: 640px) {
        .entete {
          width: calc(100% - 32px);
        }

        .entete nav {
          font-size: 12px;
          text-transform: uppercase;
        }

        .page-404 {
          gap: 113px;
          padding-block: 100px 113px;
        }

        .page-404 p {
          max-width: 28ch;
        }

        .pied-de-page {
          gap: 12px;
        }

        .pied-de-page .logo {
          font-size: 48px;
        }

        .pied-de-page p {
          max-width: 17ch;
        }
      }
    </style>
  </head>
  <body>
    <header class="conteneur entete">
      <a class="logo" href="./index.html" aria-label="Kasa, accueil">
        k<span class="maison" aria-hidden="true"></span>sa
      </a>
      <nav aria-label="Navigation principale">
        <a href="./index.html">Accueil</a>
        <a href="./index.html#a-propos">À propos</a>
      </nav>
    </header>

    <main class="conteneur page-404">
      <h1>404</h1>
      <p>Oups ! La page que vous demandez n’existe pas.</p>
      <a href="./index.html">Retourner sur la page d’accueil</a>
    </main>

    <footer class="pied-de-page">
      <span class="logo" role="img" aria-label="Kasa">
        k<span class="maison" aria-hidden="true"></span>sa
      </span>
      <p>© 2020 Kasa. All rights reserved</p>
    </footer>
  </body>
</html>
