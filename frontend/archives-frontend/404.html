<!doctype html>
<html lang="fr">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>404 - Page non trouvée</title>
    <style>
        :root {
            --coral: #ff6060;
            font-family: Montserrat, century gothic, sans-serif;
            color: #000;
            background: #fff;
        }
        * {
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        a {
            color: inherit;
        }

        .site-header {
            width: min(1240px, calc(100% - 80px));
            margin:auto;
            padding-top: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: inline-flex;
            align-items: baseline;
            gap: 0.25em;
            color: var(--coral);
            font-size: 88px;
            line-height: 1;
            letter-spacing: -0.4em;
            text-decoration: underline;
            white-space: nowrap;
        }

        .brand .house {
            position: relative;
            width: 1.53em;
            height: 1.59em;
            background-color: var(--coral);
            clip-path: polygon(0% 34%, 29% 0%, 100% 33%, 100% 79%, 55% 100% , 0 73%);
        }

        .brand .house::after {
            position: absolute;
            inset: 38% 13% 0 55%;
            background: var(--brand-background, #fff);
            clip-path: polygon(34% 0, 100% 22%, 100% 100%, 0 100%, 0 48%);
            content: "";
        }

        .site-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

    </style>
  </head>
  <body>
    <main class="site-main">
      <h1>404</h1>
      <p>La page que vous recherchez n'existe pas.</p>
      <a href="/">Retour à l'accueil</a>
    </main>
  </body>
</html>
